[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-analyst-assistant"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "google-genai==1.65.0",
  "pandas==2.3.3",
  "pydantic==2.12.5",
  "python-dotenv==1.2.1",
  "streamlit==1.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

